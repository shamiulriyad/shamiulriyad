name: Badge probe
on:
  push:
    branches: [claude/nice-bardeen-ohovh5]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body='{"mode":"markdown","text":"![c](https://hits.sh/github.com/probe-badge-test-z.svg?label=PROFILE%20VIEWS&color=10b981&labelColor=555555&style=flat-square&extraCount=2026)\n\n![b](https://visitor-badge.laobi.icu/badge?page_id=probe-badge-test-z)"}'
          curl -sS -X POST https://api.github.com/markdown -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d "$body" | grep -o 'https://camo.githubusercontent.com/[^"]*' | sort -u > camo.txt
          while read u; do
            echo "== $(echo ${u##*/} | xxd -r -p)"
            for i in $(seq 1 15); do curl -s -D h -o b -m 30 -w "%{http_code} %{time_total}s\n" "$u" || true; sleep 1; done
            grep -i 'cache-control\|^age' h || true; grep -o 'aria-label="[^"]*"' b || head -c 300 b; echo
          done < camo.txt
