name: Badge probe
on:
  push:
    branches: [claude/nice-bardeen-ohovh5]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body='{"mode":"markdown","text":"![a](https://komarev.com/ghpvc/?username=probe-badge-test-x&label=PROFILE%20VIEWS&color=10b981&style=flat-square)\n![b](https://visitor-badge.laobi.icu/badge?page_id=probe-badge-test-x)\n![c](https://hits.sh/github.com/probe-badge-test-x.svg)\n![d](https://komarev.com/ghpvc/?username=probe-badge-test-y&base=2026)"}'
          curl -sS -X POST https://api.github.com/markdown -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d "$body" | grep -o 'https://camo.githubusercontent.com/[^"]*' | sort -u > camo.txt
          while read u; do
            echo "== $(echo ${u##*/} | xxd -r -p)"
            for i in $(seq 1 10); do curl -s -o b -m 30 -w "%{http_code} %{time_total}s\n" "$u"; sleep 1; done
            grep -o '<text[^>]*>[^<]*' b | tail -1; grep -o 'aria-label="[^"]*"' b
          done < camo.txt
