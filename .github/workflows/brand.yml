name: Profile brand assets

# Builds assets/*.svg. The hero embeds assets/hero-photo.jpg (or .png) when present,
# since GitHub blocks external images inside SVGs. Output is deterministic, so a run on main after
# merging a branch that already built it produces no new commit.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/brand.py
      - scripts/typeset.py
      - scripts/fonts/**
      - assets/hero-photo.*
      - .github/workflows/brand.yml

permissions:
  contents: write

concurrency:
  group: brand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.66.1
      - name: Build assets
        run: |
          photo=$(ls assets/hero-photo.jpg assets/hero-photo.jpeg assets/hero-photo.png 2>/dev/null | head -1)
          python scripts/brand.py ${photo:+--photo "$photo"}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "Build profile brand assets"; git pull --rebase; git push; }
