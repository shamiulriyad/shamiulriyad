name: Profile telemetry

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/telemetry.py
      - scripts/brand.py
      - scripts/typeset.py
      - .github/workflows/telemetry.yml

permissions:
  contents: write

concurrency:
  group: telemetry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.66.1
      - name: Render assets/telemetry.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a PAT for this account, needed while the profile is private.
          TELEMETRY_TOKEN: ${{ secrets.TELEMETRY_TOKEN }}
          TZ_OFFSET_HOURS: "6"
        run: python scripts/telemetry.py
      # Branches only dry-run the render: bot commits there would conflict with main's copy.
      - name: Commit if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.svg
          git diff --cached --quiet || { git commit -m "Update profile telemetry"; git pull --rebase; git push; }
