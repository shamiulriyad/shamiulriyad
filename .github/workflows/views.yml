name: Profile views

# Refreshes the README's views badge from komarev.com's count (see scripts/views.py).
# Main only: each run counts as one komarev hit, and scripts/views.py subtracts
# them by this workflow's run number.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/views.py
      - .github/workflows/views.yml

permissions:
  contents: write

concurrency:
  group: views
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.66.1
      - name: Render the views badge
        run: python scripts/views.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A 'assets/views-*.svg' assets/views.json README.md
          git diff --cached --quiet || { git commit -m "Update profile views"; git pull --rebase; git push; }
