<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6573"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7C80"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B03A2E"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="390.0" y="18.0" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">Diagram 7 · Feedback-driven adaptation cycle</text><rect x="60.0" y="60.0" width="170.0" height="74.0" rx="6" fill="#E7EDF5" stroke="#1F3A5F" stroke-width="1.3"/><text x="145.0" y="89.9" font-size="10" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">1 AI inspection</text><text x="145.0" y="102.1" font-size="8.2" font-weight="400" fill="#1C2430" text-anchor="middle" style="">memory version v_t;</text><text x="145.0" y="112.1" font-size="8.2" font-weight="400" fill="#1C2430" text-anchor="middle" style="">scores, maps, status</text><rect x="310.0" y="60.0" width="170.0" height="74.0" rx="6" fill="#E7EDF5" stroke="#1F3A5F" stroke-width="1.3"/><text x="395.0" y="89.9" font-size="10" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">2 Review queue</text><text x="395.0" y="102.1" font-size="8.2" font-weight="400" fill="#1C2430" text-anchor="middle" style="">prioritise uncertain,</text><text x="395.0" y="112.1" font-size="8.2" font-weight="400" fill="#1C2430" text-anchor="middle" style="">unknown, high-impact</text><rect x="560.0" y="60.0" width="170.0" height="74.0" rx="6" fill="#FBF1DF" stroke="#B7791F" stroke-width="1.3"/><text x="645.0" y="89.9" font-size="10" font-weight="700" fill="#B7791F" text-anchor="middle" style="">3 Engineer verification</text><text x="645.0" y="102.1" font-size="8.2" font-weight="400" fill="#1C2430" text-anchor="middle" style="">confirm · reject · correct</text><text x="645.0" y="112.1" font-size="8.2" font-weight="400" fill="#1C2430" text-anchor="middle" style="">· label · mark unknown</text><rect x="560.0" y="250.0" width="170.0" height="74.0" rx="6" fill="#FBF1DF" stroke="#B7791F" stroke-width="1.3"/><text x="645.0" y="279.9" font-size="10" font-weight="700" fill="#B7791F" text-anchor="middle" style="">4 Verification gate</text><text x="645.0" y="292.1" font-size="8.2" font-weight="400" fill="#1C2430" text-anchor="middle" style="">quarantine; novelty gate;</text><text x="645.0" y="302.1" font-size="8.2" font-weight="400" fill="#1C2430" text-anchor="middle" style="">2nd reviewer for &#x27;normal&#x27;</text><rect x="310.0" y="250.0" width="170.0" height="74.0" rx="6" fill="#E2F1F1" stroke="#0F7C80" stroke-width="1.3"/><text x="395.0" y="279.9" font-size="10" font-weight="700" fill="#0F7C80" text-anchor="middle" style="">5 Versioned memory update</text><text x="395.0" y="292.1" font-size="8.2" font-weight="400" fill="#1C2430" text-anchor="middle" style="">M_(t+1) = U(M_t, verified</text><text x="395.0" y="302.1" font-size="8.2" font-weight="400" fill="#1C2430" text-anchor="middle" style="">feedback); log provenance</text><rect x="60.0" y="250.0" width="170.0" height="74.0" rx="6" fill="#F2F4F7" stroke="#5B6573" stroke-width="1.3"/><text x="145.0" y="279.9" font-size="10" font-weight="700" fill="#5B6573" text-anchor="middle" style="">6 Regression check</text><text x="145.0" y="292.1" font-size="8.2" font-weight="400" fill="#1C2430" text-anchor="middle" style="">held-out dies: no loss in</text><text x="145.0" y="302.1" font-size="8.2" font-weight="400" fill="#1C2430" text-anchor="middle" style="">AUROC / recall → accept</text><line x1="230.0" y1="97.0" x2="308.0" y2="97.0" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#an)"/><line x1="480.0" y1="97.0" x2="558.0" y2="97.0" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#an)"/><line x1="645.0" y1="134.0" x2="645.0" y2="248.0" stroke="#B7791F" stroke-width="1.5" marker-end="url(#aa)"/><text x="650.0" y="195.0" font-size="8.4" font-weight="400" fill="#B7791F" text-anchor="start" style="font-style:italic;">verified decisions</text><line x1="558.0" y1="287.0" x2="482.0" y2="287.0" stroke="#B7791F" stroke-width="1.5" marker-end="url(#aa)"/><text x="520.0" y="280.0" font-size="8.4" font-weight="400" fill="#B7791F" text-anchor="middle" style="font-style:italic;">accepted items</text><line x1="308.0" y1="287.0" x2="232.0" y2="287.0" stroke="#0F7C80" stroke-width="1.5" marker-end="url(#at)"/><text x="270.0" y="280.0" font-size="8.4" font-weight="400" fill="#0F7C80" text-anchor="middle" style="font-style:italic;">candidate v_(t+1)</text><line x1="145.0" y1="248.0" x2="145.0" y2="136.0" stroke="#0F7C80" stroke-width="1.5" marker-end="url(#at)"/><text x="150.0" y="195.0" font-size="8.4" font-weight="400" fill="#0F7C80" text-anchor="start" style="font-style:italic;">deploy v_(t+1)</text><path d="M100,324 C100,370 400,370 395,326" fill="none" stroke="#B03A2E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ar)"/><text x="250.0" y="375.0" font-size="8.4" font-weight="400" fill="#B03A2E" text-anchor="middle" style="font-style:italic;">fail → roll back to v_t and inspect the offending feedback</text><text x="645.0" y="360.0" font-size="8.2" font-weight="400" fill="#B7791F" text-anchor="middle" style="font-style:italic;">rejected / doubtful feedback</text><text x="645.0" y="370.0" font-size="8.2" font-weight="400" fill="#B7791F" text-anchor="middle" style="font-style:italic;">stays in quarantine</text><text x="390.0" y="175.0" font-size="8.8" font-weight="400" fill="#5B6573" text-anchor="middle" style="">The model weights stay frozen in this loop;</text><text x="390.0" y="185.7" font-size="8.8" font-weight="400" fill="#5B6573" text-anchor="middle" style="">only the reference memory changes, and every change can be undone.</text></svg>