<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6573"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7C80"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B03A2E"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="390.0" y="18.0" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">Defect-preserving alignment: two ways to align, one recommended</text><rect x="16.0" y="50.0" width="170.0" height="60.0" rx="6" fill="#E7EDF5" stroke="#1F3A5F" stroke-width="1.3"/><text x="101.0" y="78.0" font-size="10" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">Target die x</text><text x="101.0" y="90.2" font-size="8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">native pixel grid</text><rect x="16.0" y="140.0" width="170.0" height="60.0" rx="6" fill="#E2F1F1" stroke="#0F7C80" stroke-width="1.3"/><text x="101.0" y="168.0" font-size="10" font-weight="700" fill="#0F7C80" text-anchor="middle" style="">Reference dies R</text><text x="101.0" y="180.2" font-size="8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">K normal images</text><rect x="240.0" y="95.0" width="150.0" height="60.0" rx="6" fill="#FFFFFF" stroke="#5B6573" stroke-width="1.3"/><text x="315.0" y="118.4" font-size="10" font-weight="700" fill="#1C2430" text-anchor="middle" style="">Estimate T</text><text x="315.0" y="130.6" font-size="7.8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">coarse: 0/90/180/270 +</text><text x="315.0" y="140.1" font-size="7.8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">Fourier–Mellin; fine: ECC</text><line x1="186.0" y1="80.0" x2="238.0" y2="115.0" stroke="#5B6573" stroke-width="1.5" marker-end="url(#ag)"/><line x1="186.0" y1="170.0" x2="238.0" y2="135.0" stroke="#0F7C80" stroke-width="1.5" marker-end="url(#at)"/><rect x="440.0" y="30.0" width="320.0" height="74.0" rx="6" fill="#F8E5E2" stroke="#B03A2E" stroke-width="1.3"/><text x="600.0" y="60.0" font-size="9.6" font-weight="700" fill="#B03A2E" text-anchor="middle" style="">Option A (NOT recommended): warp the target</text><text x="600.0" y="71.7" font-size="8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">T⁻¹(x) resamples the die under inspection: a 1–2 px</text><text x="600.0" y="81.5" font-size="8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">defect is interpolated, blurred or partly cut at borders</text><rect x="440.0" y="126.0" width="320.0" height="84.0" rx="6" fill="#E2F1F1" stroke="#0F7C80" stroke-width="1.3"/><text x="600.0" y="156.1" font-size="9.6" font-weight="700" fill="#0F7C80" text-anchor="middle" style="">Option B (recommended): warp the references</text><text x="600.0" y="167.9" font-size="8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">T(R) brings references into the target&#x27;s frame; target</text><text x="600.0" y="177.6" font-size="8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">pixels are never resampled; invalid border regions are</text><text x="600.0" y="187.4" font-size="8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">masked; references are clean, so interpolation is harmless</text><line x1="390.0" y1="115.0" x2="438.0" y2="70.0" stroke="#B03A2E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar)"/><line x1="390.0" y1="135.0" x2="438.0" y2="165.0" stroke="#0F7C80" stroke-width="1.5" marker-end="url(#at)"/></svg>