e</text><rect x="566.0" y="200.0" width="114.0" height="58.0" rx="4" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/><text x="623.0" y="226.9" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style="">nothing</text><text x="623.0" y="237.1" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style="">(read-only)</text><rect x="692.0" y="200.0" width="94.0" height="58.0" rx="4" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/><text x="739.0" y="232.0" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style="">ms–s per die</text><rect x="18.0" y="270.0" width="170.0" height="58.0" rx="6" fill="#FBF1DF" stroke="#B7791F" stroke-width="1.3"/><text x="103.0" y="301.9" font-size="10" font-weight="700" fill="#B7791F" text-anchor="middle" style="">Feedback update</text><rect x="194.0" y="270.0" width="250.0" height="58.0" rx="4" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/><text x="319.0" y="296.9" font-size="8.3" font-weight="400" fill="#1C2430" text-anchor="middle" style="">verified feedback → gate → versioned</text><text x="319.0" y="307.0" font-size="8.3" font-weight="400" fill="#1C2430" text-anchor="middle" style="">edit of M → regression check</text><rect x="450.0" y="270.0" width="104.0" height="58.0" rx="4" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/><text x="502.0" y="296.9" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style="">per verified</text><text x="502.0" y="307.1" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style="">batch</text><rect x="566.0" y="270.0" width="114.0" height="58.0" rx="4" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/><text x="623.0" y="296.9" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style="">memory M</text><text x="623.0" y="307.1" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style="">(versioned)</text><rect x="692.0" y="270.0" width="94.0" height="58.0" rx="4" fi