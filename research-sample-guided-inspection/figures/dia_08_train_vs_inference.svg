<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6573"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7C80"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B03A2E"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="400.0" y="18.0" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">Diagram 8 · Training vs enrolment vs inference vs update</text><text x="103.0" y="46.0" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">Stage</text><text x="319.0" y="46.0" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">What happens</text><text x="505.0" y="46.0" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">How often</text><text x="626.0" y="46.0" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">What changes</text><text x="742.0" y="46.0" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">Compute</text><rect x="18.0" y="60.0" width="170.0" height="58.0" rx="6" fill="#F2F4F7" stroke="#5B6573" stroke-width="1.3"/><text x="103.0" y="87.3" font-size="10" font-weight="700" fill="#5B65