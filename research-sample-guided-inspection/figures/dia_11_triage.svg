00" fill="#1C2430" text-anchor="middle" style="">memory M_N</text><line x1="156.0" y1="122.0" x2="194.0" y2="122.0" stroke="#5B6573" stroke-width="1.5" marker-end="url(#ag)"/><rect x="196.0" y="190.0" width="150.0" height="44.0" rx="6" fill="#E2F1F1" stroke="#0F7C80" stroke-width="1.3"/><text x="271.0" y="210.0" font-size="10" font-weight="700" fill="#0F7C80" text-anchor="middle" style="">NORMAL</text><text x="271.0" y="222.2" font-size="8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">no action</text><line x1="271.0" y1="154.0" x2="271.0" y2="188.0" stroke="#5B6573" stroke-width="1.5" marker-end="url(#ag)"/><text x="280.0" y="175.0" font-size="8.4" font-weight="400" fill="#5B6573" text-anchor="start" style="font-style:italic;">no</text><rect x="392.0" y="90.0" width="170.0" height="64.0" rx="6" fill="#FFFFFF" stroke="#5B6573" stroke-width="1.3"/><text x="477.0" y="109.2" font-size="9.4" font-weight="700" fill="#1C2430" text-anchor="middle" style="">d_c = distance to each</text><text x="477.0" y="120.7" font-size="9.4" font-weight="700" fill="#1C2430" text-anchor="middle" style="">known-defect prototype</text><text x="477.0" y="132.2" font-size="8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">nearest class c*, margin</text><text x="477.0" y="141.9" font-size="8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">to 2nd nearest</text><line x1="346.0" y1="122.0" x2="390.0" y2="122.0" stroke="#5B6573" stroke-width="1.5" marker-end="url(#ag)"/><text x="368.0" y="114.0" font-size="8.4" font-weight="400" fill="#5B6573" text-anchor="middle" style="font-style:italic;">yes</text><rect x="608.0" y="30.0" width="160.0" height="58.0" rx="6" fill="#FBF1DF" stroke="#B7791F" stroke-width="1.3"/><text x="688.0" y="52.1" font-size="10" font-weight="700" fill="#B7791F" text-anchor="middle" style="">KNOWN defect c*</text><text x="688.0" y="64.3" font-size="8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">if d_c* &lt; τ_k 