yle="">Versioned memory update</text><text x="710.0" y="642.0" font-size="7.8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">add / remove / relabel items;</text><text x="710.0" y="651.5" font-size="7.8" font-weight="400" fill="#1C2430" text-anchor="middle" style="">log provenance</text><path d="M610,669 L620,669 L620,361 L628,361" fill="none" stroke="#B7791F" stroke-width="1.5" marker-end="url(#aa)"/><path d="M710.0,668 L710.0,722 L262,722 L262,502" fill="none" stroke="#B7791F" stroke-width="1.5" marker-end="url(#aa)"/><text x="470.0" y="716.0" font-size="8.2" font-weight="400" fill="#B7791F" text-anchor="middle" style="font-style:italic;">verified, gated update of M (no weight training)</text><text x="110.0" y="492.0" font-size="7.8" font-weight="400" fill="#5B6573" text-anchor="middle" style="">Optional (periodic):</text><text x="110.0" y="501.5" font-size="7.8" font-weight="400" fill="#5B6573" text-anchor="middle" style="">fine-tune encoder with replay;</text><text x="110.0" y="511.0" font-size="7.8" font-weight="400" fill="#5B6573" text-anchor="middle" style="">see Diagram 8</text></svg>