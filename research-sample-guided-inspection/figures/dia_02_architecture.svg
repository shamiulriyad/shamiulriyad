<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" width="800" height="740" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6573"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7C80"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B03A2E"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="400.0" y="18.0" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">Diagram 2 · Detailed system architecture</text><text x="110.0" y="44.0" font-size="10" font-weight="700" fill="#0F7C80" text-anchor="middle" style="">A · Reference enrolment</text><text x="110.0" y="56.0" font-size="8" font-weight="400" fill="#5B6573" text-anchor="middle" style="">(once per die type / recipe)</text><text x="507.0" y="44.0" font-size="10" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">B · Inspection of a new die</text><text x="507.0" y="56.0" font-size="8" font-weight="400" fill="#5B6573" text-anchor="middle" style="">(every die)</text><text x="712.0" y="44.0" font-size="10" font-weight="700" fill="#B7791F" text-anchor="middle" style="">C · Feedback</text><text x="712.0" y="56.0" font-size="8" font-weight="400" fill="#5B6573" text-anchor="middle" style="">(verified cases)</text><rect x="18.0" y="70.0" width="186.0" height="56.0" rx="6" fill="#E2F1F1" stroke="#0F7C80" stroke-width="1.3"/><text x="111.0" y="91.3" font-size="10" font-weight="700" fill="#0F7C80" text-anchor="middle" style="">Reference dies</text><text x="111.0" y="103.5" font-size="7.9" font-weight="400" fill="#1C2430" text-anchor="middle" style="">K normal images; optional</text><text x="111.0" y="113.1" font-size="7.9" font-weight="400" fill="#1C2430" text-anchor="middle" style="">few known-defect images</text><line x1="111.0" y1="126.0" x2="111.0" y2="144.0" stroke="#0F7C80" stroke-width="1.5" marker-end="url(#at)"/><rect x="18.0" y="146.0" width="186.0" height="56.0" rx="6" fill="#E2F1F1" stroke="#0F7C80" stroke-width="1.3"/><text x="111.0" y="167.3" font-size="10" font-weight="700" fill="#0F7C80" text-anchor="middle" style="">Preprocess + QC</text><text x="111.0" y="179.5" font-size="7.9" font-weight="400" fill="#1C2430" text-anchor="middle" style="">focus / noise / saturation</text><text x="111.0" y="189.1" font-size="7.9" font-weight="400" fill="#1C2430" text-anchor="middle" style="">check; reject bad images</text><line x1="111.0" y1="202.0" x2="111.0" y2="220.0" stroke="#0F7C80" stroke-width="1.5" marker-end="url(#at)"/><rect x="18.0" y="222.0" width="186.0" height="56.0" rx="6" fill="#E2F1F1" stroke="#0F7C80" stroke-width="1.3"/><text x="111.0" y="243.3" font-size="10" font-weight="700" fill="#0F7C80" text-anchor="middle" style="">Canonical pose</text><text x="111.0" y="255.5" font-size="7.9" font-weight="400" fill="#1C2430" text-anchor="middle" style="">register each reference to</text><text x="111.0" y="265.1" font-size="7.9" font-weight="400" fill="#1C2430" text-anchor="middle" style="">one template die</text><line x1="111.0" y1="278.0" x2="111.0" y2="296.0" stroke="#0F7C80" stroke-width="1.5" marker-end="url(#at)"/><rect x="18.0" y="298.0" width="186.0" height="56.0" rx="6" fill="#E2F1F1" stroke="#0F7C80" stroke-width="1.3"/><text x="111.0" y="319.3" font-size="10" font-weight="700" fill="#0F7C80" text-anchor="middle" style="">Shared encoder f</text><text x="111.0" y="331.5" font-size="7.9" font-weight="400" fill="#1C2430" text-anchor="middle" style="">same frozen weights as</text><text x="111.0" y="341.1" font-size="7.9" font-weight="400" fill="#1C2430" text-anchor="middle" style="">inspection (layers 2+3)</text><line x1="111.0" y1="354.0" x2="111.0" y2="372.0" stroke="#0F7C80" stroke-width="1.5" marker-end="url(#at)"/><rect x="18.0" y="374.0" width="186.0" height="56.0" rx="6" fill="#E2F1F1" stroke="#0F7C80" stroke-width="1.3"/><text x="111.0" y="395.3" font-size="10" font-weight="700" fill="#0F7C80" text-anchor="middle" style="">Memory QC</text><text x="111.0" y="407.5" font-size="7.9" font-weight="400" fill="#1C2430" text-anchor="middle" style="">remove outliers, de-duplicate,</text><text x="111.0" y="417.1" font-size="7.9" font-weight="400" fill="#1C2430" text-anchor="middle" style="">coreset subsample</text><rect x="222.0" y="300.0" width="166.0" height="200.0" rx="6" fill="#E2F1F1" stroke="#0F7C80" stroke-width="1.3"/><text x="305.0" y="367.3" font-size="11" font-weight="700" fill="#0F7C80" text-anchor="middle" style="">Reference memory M</text><text x="305.0" y="380.7" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style="">normal patch features M_N</text><text x="305.0" y="391.0" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style=""></text><text x="305.0" y="401.2" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style="">known-defect prototypes</text><text x="305.0" y="411.5" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style="">M_D (optional)</text><text x="305.0" y="421.7" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style=""></text><text x="305.0" y="432.0" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style="">version log, provenance,</text><text x="305.0" y="442.2" font-size="8.4" font-weight="400" fill="#1C2430" text-anchor="middle" style="">quarantine buffer</text><line x1="204.0" y1="402.0" x2="220.0" y2="420.0" stroke="#0F7C80" stroke-width="1.5" marker-end="url(#at)"/><text x="196.0" y="452.0" font-size="8" font-weight="400" fill="#0F7C80" text-anchor="middle" style="font-style:italic;">enrol</text><rect x="404.0" y="64.0" width="206.0" height="44.0" rx="6" fill="#F2F4F7" stroke="#5B6573" stroke-width="1.3"/><text x="507.0" y="79.5" font-size="9.6" font-weight="700" fill="#5B6573" text-anchor="middle" style="">Input</text><text x="507.0" y="91.2" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">die / wafer images + metadata</text><text x="507.0" y="100.5" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">(wafer ID, die index, recipe)</text><line x1="507.0" y1="108.0" x2="507.0" y2="120.0" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#an)"/><rect x="404.0" y="122.0" width="206.0" height="44.0" rx="6" fill="#E7EDF5" stroke="#1F3A5F" stroke-width="1.3"/><text x="507.0" y="137.5" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">1 Preprocessing</text><text x="507.0" y="149.2" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">illumination &amp; contrast norm.;</text><text x="507.0" y="158.5" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">quality check (no smoothing)</text><line x1="507.0" y1="166.0" x2="507.0" y2="178.0" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#an)"/><rect x="404.0" y="180.0" width="206.0" height="44.0" rx="6" fill="#E7EDF5" stroke="#1F3A5F" stroke-width="1.3"/><text x="507.0" y="200.1" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">2 Die extraction</text><text x="507.0" y="211.9" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">find die grid, crop, index (i, j)</text><line x1="507.0" y1="224.0" x2="507.0" y2="236.0" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#an)"/><rect x="404.0" y="238.0" width="206.0" height="44.0" rx="6" fill="#E7EDF5" stroke="#1F3A5F" stroke-width="1.3"/><text x="507.0" y="253.5" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">3 Geometric registration</text><text x="507.0" y="265.2" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">estimate T (rotation, shift, scale);</text><text x="507.0" y="274.5" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">warp the REFERENCE, not target</text><line x1="507.0" y1="282.0" x2="507.0" y2="294.0" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#an)"/><rect x="404.0" y="296.0" width="206.0" height="44.0" rx="6" fill="#E7EDF5" stroke="#1F3A5F" stroke-width="1.3"/><text x="507.0" y="311.5" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">4 Visual feature encoder f</text><text x="507.0" y="323.2" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">frozen CNN / ViT;</text><text x="507.0" y="332.5" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">multi-scale patch features</text><line x1="507.0" y1="340.0" x2="507.0" y2="352.0" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#an)"/><rect x="404.0" y="354.0" width="206.0" height="44.0" rx="6" fill="#E7EDF5" stroke="#1F3A5F" stroke-width="1.3"/><text x="507.0" y="369.5" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">5 Feature matching</text><text x="507.0" y="381.2" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">k-NN search in M (within</text><text x="507.0" y="390.5" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">aligned search window)</text><line x1="507.0" y1="398.0" x2="507.0" y2="410.0" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#an)"/><rect x="404.0" y="412.0" width="206.0" height="44.0" rx="6" fill="#E7EDF5" stroke="#1F3A5F" stroke-width="1.3"/><text x="507.0" y="427.5" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">6 Anomaly scoring</text><text x="507.0" y="439.2" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">patch distance → map S,</text><text x="507.0" y="448.5" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">image score A(x)</text><line x1="507.0" y1="456.0" x2="507.0" y2="468.0" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#an)"/><rect x="404.0" y="470.0" width="206.0" height="44.0" rx="6" fill="#E7EDF5" stroke="#1F3A5F" stroke-width="1.3"/><text x="507.0" y="485.5" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">7 Localisation</text><text x="507.0" y="497.2" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">upsample, threshold τ →</text><text x="507.0" y="506.5" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">regions, boxes, masks</text><line x1="507.0" y1="514.0" x2="507.0" y2="526.0" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#an)"/><rect x="404.0" y="528.0" width="206.0" height="44.0" rx="6" fill="#E7EDF5" stroke="#1F3A5F" stroke-width="1.3"/><text x="507.0" y="543.5" font-size="9.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" style="">8 Known / unknown triage</text><text x="507.0" y="555.2" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">match region features to M_D:</text><text x="507.0" y="564.5" font-size="7.6" font-weight="400" fill="#1C2430" text-anchor="middle" style="">known class or UNKNOWN</text><line x1="507.0" y1="572.0" x2="507.0" y2="584.0" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#an)"/><rect x="404.0" y="586.0" width="206.0" height="44.0" rx="6" fill="#E7EDF5" stroke="#1F3A5F" stroke-width="1.3"/><text x="507.0" y="601.5" font-size="9.6" font-weight="700" 