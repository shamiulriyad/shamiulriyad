<text x="40" y="650" font-size="20" font-weight="400" fill="#1c2430" text-anchor="start">candidate reference R̂  ·  per-die masks Mₖ and weights wₖ  ·  support S  ·  uncertainty U  ·  abstention mask A  ·  provenance map  ·  report</text>
<line x1="163.5" y1="464" x2="163.5" y2="576" stroke="#5b6573" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="692" width="1560" height="70" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.2"/>
<text x="40" y="735" font-size="19" font-weight="400" fill="#5b6573" text-anchor="start">Cross-cutting: YAML configuration · fixed seeds · versioned data manifest · per-stage logs · failure-case gallery · no stage may overwrite an abstained pixel</text></svg>